<!doctype html>

<title>Therapo · اتصال برقرار نیست</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root { color-scheme: light dark; --bg: #f6faf9; --card: #fff; --ink: #1d2b30; --muted: #5f7179; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f191d; --card: #172328; --ink: #eef6f7; --muted: #9fb1ba; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif; padding: 16px; box-sizing: border-box; }
  .c { max-width: 380px; text-align: center; background: var(--card); border-radius: 24px; padding: 28px 22px; box-shadow: 0 18px 50px -30px rgba(0, 0, 0, .4); }
  h1 { font-size: 20px; margin: 12px 0 6px; } p { color: var(--muted); line-height: 1.9; margin: 0 0 18px; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 12px 22px; background: #12b3a8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main class="c">
  <img src="appicons/icon-192.png" width="72" height="72" alt="">
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>Therapo برای باز کردن درس‌ها و ذخیره پیشرفتت به اینترنت نیاز دارد. اتصال را بررسی کن و دوباره امتحان کن.<br><span lang="en" dir="ltr">You are offline — please check your connection.</span></p>
  <button type="button" onclick="location.reload()">تلاش دوباره · Retry</button>
</main>
</body>
